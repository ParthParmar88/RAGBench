name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default Linux wheel bundles ~2 GB of CUDA
          # libraries that CI never uses.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      # The suite is offline: every LLM, embedding and database call is faked,
      # and tests/conftest.py injects a dummy API key. No secrets needed.
      - name: Run tests
        run: python -m pytest -q
